name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: estadia20-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy roomies20
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://llaves365.com

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:vps

      - name: Bundle Google authentication verifier
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --no-compile \
            --only-binary=:all: \
            --requirement vps/requirements-google.txt \
            --target vps/public/.server_vendor
          PYTHONPATH="$GITHUB_WORKSPACE/vps/public/.server_vendor" \
            python3 -c "from google.oauth2 import id_token; assert id_token"

      - name: Validate backend
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile vps/server.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.test_google_auth

      - name: Package release
        run: |
          tar -C vps -czf "$RUNNER_TEMP/estadia20-release.tgz" public server.py
          test -s "$RUNNER_TEMP/estadia20-release.tgz"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          port="${VPS_PORT:-22}"
          scp -P "$port" "$RUNNER_TEMP/estadia20-release.tgz" "$VPS_USER@$VPS_HOST:/tmp/estadia20-release.tgz"
          ssh -p "$port" "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/estadia20-deploy /tmp/estadia20-release.tgz"

      - name: Verify public health
        run: |
          health_file="$RUNNER_TEMP/estadia20-health.json"
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 2 --retry-all-errors \
            https://llaves365.com/api/health > "$health_file"
          python3 - "$health_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              health = json.load(response)

          if health.get("ok") is not True or health.get("database") is not True:
              raise SystemExit(f"Unexpected health response: {health!r}")
          PY

      - name: Remove runner SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
